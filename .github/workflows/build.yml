name: Build and test
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: npx --yes pnpm@10.11.1 install --frozen-lockfile
      - name: Typecheck
        run: npx --yes pnpm@10.11.1 typecheck
      - name: Unit tests
        run: npx --yes pnpm@10.11.1 test
      - name: Extension build
        run: npx --yes pnpm@10.11.1 build
      - name: Browser extension smoke test
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" npx --yes pnpm@10.11.1 extension:test
      - name: Publish installable Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: ai-newtab-chrome-mv3
          path: apps/extension/.output/chrome-mv3/
          if-no-files-found: error
          retention-days: 14
